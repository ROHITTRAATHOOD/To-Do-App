<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pro Task Manager</title>

  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- GOOGLE FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>Task Manager</h1>
      <p>Manage your daily tasks professionally</p>
    </div>

    <!-- INPUT -->
    <div class="input-section">

      <input 
        type="text" 
        id="taskInput" 
        placeholder="Enter your task..."
      >

      <button id="addTaskBtn">
        <i class="fa-solid fa-plus"></i>
        Add
      </button>

    </div>

    <!-- FILTER -->
    <div class="filter-section">

      <button class="filter-btn active" data-filter="all">
        All
      </button>

      <button class="filter-btn" data-filter="pending">
        Pending
      </button>

      <button class="filter-btn" data-filter="completed">
        Completed
      </button>

    </div>

    <!-- STATS -->
    <div class="stats">

      <div class="card">
        <h2 id="totalTasks">0</h2>
        <p>Total</p>
      </div>

      <div class="card">
        <h2 id="completedTasks">0</h2>
        <p>Completed</p>
      </div>

      <div class="card">
        <h2 id="pendingTasks">0</h2>
        <p>Pending</p>
      </div>

    </div>

    <!-- TASK LIST -->
    <ul id="taskList"></ul>

    <!-- EMPTY -->
    <div class="empty-state" id="emptyState">
      <img src="https://cdn-icons-png.flaticon.com/512/4076/4076478.png">
      <h3>No Tasks Yet</h3>
      <p>Add your first task to get started</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
